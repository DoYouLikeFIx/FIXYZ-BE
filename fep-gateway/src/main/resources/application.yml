server:
  port: 8083

internal:
  secret: ${INTERNAL_SECRET:local-internal-secret}

fep:
  marketdata:
    provider: ${FEP_MARKETDATA_PROVIDER:NONE}
    source-mode: ${FEP_MARKETDATA_SOURCE_MODE:REPLAY}
    delayed:
      delay-ms: ${FEP_MARKETDATA_DELAYED_DELAY_MS:900000}
      drain-interval-ms: ${FEP_MARKETDATA_DELAYED_DRAIN_INTERVAL_MS:1000}
    replay:
      seed: ${FEP_MARKETDATA_REPLAY_SEED:epic-11-replay-seed}
      speed-factor: ${FEP_MARKETDATA_REPLAY_SPEED_FACTOR:1.0000}
      start-offset: ${FEP_MARKETDATA_REPLAY_START_OFFSET:0}
      drain-interval-ms: ${FEP_MARKETDATA_REPLAY_DRAIN_INTERVAL_MS:1000}
      symbols: ${FEP_MARKETDATA_REPLAY_SYMBOLS:005930}
    kis:
      env: ${FEP_MARKETDATA_KIS_ENV:paper}
      app-key: ${FEP_MARKETDATA_KIS_APP_KEY:}
      app-secret: ${FEP_MARKETDATA_KIS_APP_SECRET:}
      ws:
        tr-id: ${FEP_MARKETDATA_KIS_WS_TR_ID:H0STCNT0}
        custtype: ${FEP_MARKETDATA_KIS_WS_CUSTTYPE:P}
        symbols: ${FEP_MARKETDATA_KIS_SYMBOLS:005930}
  replay:
    max-virtual-fill-deviation-bps: ${FEP_REPLAY_MAX_VIRTUAL_FILL_DEVIATION_BPS:500}
  simulator:
    control-plane-base-url: ${FEP_SIMULATOR_CONTROL_PLANE_BASE_URL:http://fep-simulator:8082}
    trace-bridge-enabled: ${FEP_SIMULATOR_TRACE_BRIDGE_ENABLED:true}

spring:
  application:
    name: fep-gateway
  datasource:
    url: ${FEP_GATEWAY_DB_URL:jdbc:mysql://localhost:3306/fep_gateway_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${FEP_GATEWAY_DB_USERNAME:fix}
    password: ${FEP_GATEWAY_DB_PASSWORD:fix}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui/index.html

management:
  server:
    port: ${FEP_GATEWAY_MANAGEMENT_PORT:18083}
    address: ${FEP_GATEWAY_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
