plugins {
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
  id 'org.springdoc.openapi-gradle-plugin'
}

ext.openapiDefaultPort = 28082
ext.openapiManagementPort = 29082
ext.openapiReadyUrl = 'http://localhost:29082/actuator/health'
ext.openapiBootRunDependencies = [':core-common:jar']
ext.openapiWaitTimeInSeconds = 30

apply from: rootProject.file('gradle/openapi-contract.gradle')

tasks.register('correlationPropagationTests', Test) {
  description = 'Runs fep-gateway correlation propagation regressions.'
  group = 'verification'
  useJUnitPlatform()
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching('com.fix.fepgateway.dataplane.fix.FepSimulatorTraceBridgeClientTest')
    includeTestsMatching('com.fix.fepgateway.dataplane.fix.FixDataPlaneServiceTraceBridgeTest')
    includeTestsMatching('com.fix.fepgateway.filter.CorrelationIdFilterTest')
    includeTestsMatching('com.fix.fepgateway.security.InternalSecretFilterTest')
    includeTestsMatching('com.fix.fepgateway.integration.FepGatewaySimulatorTraceBridgeIntegrationTest')
  }
}

dependencies {
  implementation project(':core-common')

  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'
  implementation 'org.quickfixj:quickfixj-core:2.3.2'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'com.h2database:h2'
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testRuntimeOnly 'com.mysql:mysql-connector-j'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
  testImplementation platform("org.testcontainers:testcontainers-bom:${rootProject.ext.testcontainersVersion}")
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:mysql'
  testImplementation "org.wiremock:wiremock-standalone:${rootProject.ext.wiremockVersion}"
}
