plugins {
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
  id 'org.springdoc.openapi-gradle-plugin'
}

def springdocPort = 18082

openApi {
  apiDocsUrl = "http://localhost:${springdocPort}/v3/api-docs"
  outputDir = file("$buildDir/openapi")
  outputFileName = "${project.name}.json"
  waitTimeInSeconds = 30
  customBootRun {
    args = ["--spring.profiles.active=openapi"]
  }
}

tasks.named('forkedSpringBootRun') {
  dependsOn(':core-common:jar')
}

tasks.register('verifyCommittedOpenApi') {
  dependsOn tasks.named('generateOpenApiDocs')

  doLast {
    File generated = file("$buildDir/openapi/${project.name}.json")
    File committed = rootProject.file("contracts/openapi/${project.name}.json")

    if (!generated.exists()) {
      throw new GradleException("Generated OpenAPI file is missing: ${generated}")
    }
    if (!committed.exists()) {
      throw new GradleException("Committed OpenAPI file is missing: ${committed}")
    }

    String generatedText = generated.getText('UTF-8').replace("\r\n", "\n")
    String committedText = committed.getText('UTF-8').replace("\r\n", "\n")
    def jsonSlurper = new groovy.json.JsonSlurper()
    if (jsonSlurper.parseText(generatedText) != jsonSlurper.parseText(committedText)) {
      throw new GradleException(
          "Committed OpenAPI snapshot is out of date. Regenerate :fep-gateway:generateOpenApiDocs and sync contracts/openapi/${project.name}.json."
      )
    }
  }
}

tasks.named('check') {
  dependsOn tasks.named('verifyCommittedOpenApi')
}

tasks.register('correlationPropagationTests', Test) {
  description = 'Runs fep-gateway correlation propagation regressions.'
  group = 'verification'
  useJUnitPlatform()
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching('com.fix.fepgateway.dataplane.fix.FepSimulatorTraceBridgeClientTest')
    includeTestsMatching('com.fix.fepgateway.filter.CorrelationIdFilterTest')
    includeTestsMatching('com.fix.fepgateway.security.InternalSecretFilterTest')
    includeTestsMatching('com.fix.fepgateway.integration.FepGatewaySimulatorTraceBridgeIntegrationTest')
  }
}

dependencies {
  implementation project(':core-common')

  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'
  implementation 'org.quickfixj:quickfixj-core:2.3.2'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'com.h2database:h2'
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testRuntimeOnly 'com.mysql:mysql-connector-j'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
  testImplementation platform("org.testcontainers:testcontainers-bom:${rootProject.ext.testcontainersVersion}")
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:mysql'
  testImplementation "org.wiremock:wiremock-standalone:${rootProject.ext.wiremockVersion}"
}
