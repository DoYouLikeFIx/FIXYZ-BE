server:
  port: 8081

internal:
  secret: ${INTERNAL_SECRET:local-internal-secret}

spring:
  application:
    name: corebank-service
  datasource:
    url: ${CORE_DB_URL:jdbc:mysql://localhost:3306/core_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CORE_DB_USERNAME:fix}
    password: ${CORE_DB_PASSWORD:fix}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed
    placeholders:
      seed_member_id: 1
      seed_account_id: 1
      seed_position_id: 1
      seed_execution_id: 1

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui/index.html

management:
  server:
    port: 19081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      fep-submit:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 100
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 1
      fep-status:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 100
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 1

recovery:
  max-retry-count: ${RECOVERY_MAX_RETRY_COUNT:5}
  status-query:
    # Total calls within one requery, including the first attempt.
    max-attempts: ${RECOVERY_STATUS_QUERY_MAX_ATTEMPTS:2}
    backoff-ms: ${RECOVERY_STATUS_QUERY_BACKOFF_MS:0}

corebank:
  order:
    position-lock-timeout-millis: ${COREBANK_ORDER_POSITION_LOCK_TIMEOUT_MILLIS:1000}
  provisioning:
    # Safe default for shared or misconfigured environments. Local/openapi
    # profiles and explicit env overrides can opt into funded demo balances.
    default-cash-balance: ${COREBANK_PROVISIONING_DEFAULT_CASH_BALANCE:0.0000}
