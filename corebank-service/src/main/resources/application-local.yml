spring:
  datasource:
    url: ${CORE_DB_URL:jdbc:mysql://mysql:3306/core_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CORE_DB_USERNAME:${MYSQL_USER:fix}}
    password: ${CORE_DB_PASSWORD:${MYSQL_PASSWORD:fix}}

fep:
  gateway:
    base-url: ${FEP_GATEWAY_BASE_URL:http://fep-gateway:8083}

corebank:
  provisioning:
    # Local developer sessions should start with an immediately orderable
    # balance even when the env var is omitted.
    default-cash-balance: ${COREBANK_PROVISIONING_DEFAULT_CASH_BALANCE:100000000.0000}
