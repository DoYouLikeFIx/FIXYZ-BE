server:
  port: 28081

management:
  server:
    port: 29081
    address: 127.0.0.1

internal:
  secret: local-internal-secret

spring:
  datasource:
    url: jdbc:h2:mem:core_openapi;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed
    placeholders:
      seed_member_id: 900001
      seed_account_id: 900001
      seed_position_id: 900001
      seed_execution_id: 900001

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html

corebank:
  ledger-integrity:
    enabled: false
    observability:
      stale-after: PT5M
      alert:
        unresolved-backlog-threshold: 10
        repair-pending-threshold: 5
        critical-anomaly-threshold: 1
  provisioning:
    # Local live QA/openapi sessions need immediately orderable accounts without
    # borrowing the static seed account; keep this profile-specific and verified
    # by AccountProvisioningOpenapiProfileIntegrationTest.
    default-cash-balance: 100000000.0000
