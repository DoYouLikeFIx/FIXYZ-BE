import java.time.Instant
import javax.xml.parsers.DocumentBuilderFactory

plugins {
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
  id 'org.springdoc.openapi-gradle-plugin'
}

ext.openapiDefaultPort = 28081
ext.openapiManagementPort = 29081
ext.openapiReadyUrl = 'http://localhost:29081/actuator/health'
ext.openapiBootRunDependencies = [':core-common:jar', ':corebank-domain:jar']

apply from: rootProject.file('gradle/openapi-contract.gradle')

def matchingRegressionBuildId = providers.gradleProperty('matchingRegressionBuildId')
    .orElse(providers.environmentVariable('MATCHING_REGRESSION_BUILD_ID'))
    .orElse(providers.environmentVariable('GITHUB_RUN_ID'))
    .getOrElse('local')
def matchingRegressionArtifactRoot = new File(
    rootProject.projectDir.parentFile,
    "_bmad-output/test-artifacts/matching-regression/${matchingRegressionBuildId}"
)
def matchingRegressionSuites = [
    matchingContractTests: [
        scope: 'contract',
        description: 'Runs Story 11.9 matching contract and anti-regression suites.',
        includes: [
            'com.fix.corebank.contract.CorebankMatchingContractTest',
            'com.fix.corebank.contract.CorebankMatchingAntiRegressionTest'
        ],
        xmlDir: layout.buildDirectory.dir('test-results/matchingContractTests').get().asFile,
        htmlDir: layout.buildDirectory.dir('reports/tests/matchingContractTests')
    ],
    matchingIntegrationRegressionTests: [
        scope: 'integration',
        description: 'Runs Story 11.9 matching persistence integration regressions.',
        includes: [
            'com.fix.corebank.integration.CorebankMatchingPersistenceIntegrationTest'
        ],
        xmlDir: layout.buildDirectory.dir('test-results/matchingIntegrationRegressionTests').get().asFile,
        htmlDir: layout.buildDirectory.dir('reports/tests/matchingIntegrationRegressionTests')
    ]
]

def parseMatchingRegressionSummary = { File xmlDir ->
  Map<String, Integer> summary = [
      files: 0,
      tests: 0,
      failures: 0,
      errors: 0,
      skipped: 0
  ]
  if (!xmlDir.exists()) {
    return summary
  }

  DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance()
  factory.setNamespaceAware(false)
  factory.setExpandEntityReferences(false)
  factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)

  xmlDir.eachFileRecurse { File xmlFile ->
    if (!xmlFile.name.endsWith('.xml')) {
      return
    }
    summary.files += 1
    def document = factory.newDocumentBuilder().parse(xmlFile)
    List suites = []
    if (document.documentElement != null) {
      if (document.documentElement.tagName == 'testsuite') {
        suites << document.documentElement
      } else {
        def testSuiteNodes = document.getElementsByTagName('testsuite')
        for (int index = 0; index < testSuiteNodes.length; index++) {
          suites << testSuiteNodes.item(index)
        }
      }
    }

    suites.each { suite ->
      summary.tests += (suite.getAttribute('tests') ?: '0').toInteger()
      summary.failures += (suite.getAttribute('failures') ?: '0').toInteger()
      summary.errors += (suite.getAttribute('errors') ?: '0').toInteger()
      summary.skipped += (suite.getAttribute('skipped') ?: '0').toInteger()
    }
  }

  return summary
}

sourceSets {
  resilienceScenario {
    java.srcDir 'src/resilienceScenario/java'
    resources.srcDir 'src/resilienceScenario/resources'
    compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
    runtimeClasspath += output + compileClasspath
  }
}

configurations {
  resilienceScenarioImplementation.extendsFrom testImplementation
  resilienceScenarioCompileOnly.extendsFrom testCompileOnly
  resilienceScenarioRuntimeOnly.extendsFrom testRuntimeOnly
  resilienceScenarioAnnotationProcessor.extendsFrom testAnnotationProcessor
}

tasks.withType(Test).configureEach {
  systemProperty 'corebank.ledger-integrity.enabled', 'false'
}

tasks.register('correlationPropagationTests', Test) {
  description = 'Runs the corebank correlation-id propagation regression suite.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching('com.fix.corebank.filter.CorrelationIdFilterTest')
    includeTestsMatching('com.fix.corebank.security.InternalSecretFilterTest')
  }
}

matchingRegressionSuites.each { String taskName, Map suite ->
  tasks.register(taskName, Test) {
    description = suite.description
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    ignoreFailures = true
    suite.includes.each { includePattern ->
      filter.includeTestsMatching(includePattern)
    }
    filter.setFailOnNoMatchingTests(true)
    reports.junitXml.outputLocation = suite.xmlDir
    reports.html.outputLocation = suite.htmlDir
  }
}

tasks.register('matchingRegressionEvidence') {
  description = 'Collects Story 11.9 matching regression evidence artifacts.'
  group = 'verification'
  dependsOn(
      tasks.named('matchingContractTests'),
      tasks.named('matchingIntegrationRegressionTests')
  )

  doLast {
    File junitRoot = new File(matchingRegressionArtifactRoot, 'junit')
    mkdir(junitRoot)

    List<Map<String, Object>> suiteResults = []
    matchingRegressionSuites.each { String taskName, Map suite ->
      File sourceDir = suite.xmlDir
      File targetDir = new File(junitRoot, taskName)
      delete(targetDir)
      mkdir(targetDir)
      copy {
        from(sourceDir)
        include('**/*.xml')
        into(targetDir)
      }

      Map<String, Integer> summary = parseMatchingRegressionSummary(sourceDir)
      suiteResults << [
          taskName: taskName,
          scope: suite.scope,
          includes: suite.includes,
          summary: summary
      ]
    }

    int totalTests = suiteResults.collect { it.summary.tests }.sum(0)
    int totalFailures = suiteResults.collect { it.summary.failures }.sum(0)
    int totalErrors = suiteResults.collect { it.summary.errors }.sum(0)
    int totalSkipped = suiteResults.collect { it.summary.skipped }.sum(0)
    String overallResult = (totalFailures + totalErrors) == 0 ? 'PASSED' : 'FAILED'

    File matrixSummary = new File(matchingRegressionArtifactRoot, 'matrix-summary.md')
    matrixSummary.text = """# Story 11.9 Matching Regression Summary

- Build ID: `${matchingRegressionBuildId}`
- Generated At: `${Instant.now()}`
- Overall Result: `${overallResult}`
- Totals: tests=${totalTests}, failures=${totalFailures}, errors=${totalErrors}, skipped=${totalSkipped}

| Task | Scope | Tests | Failures | Errors | Skipped | Included Classes |
| --- | --- | ---: | ---: | ---: | ---: | --- |
${suiteResults.collect { result ->
  "| `${result.taskName}` | `${result.scope}` | ${result.summary.tests} | ${result.summary.failures} | ${result.summary.errors} | ${result.summary.skipped} | ${result.includes.join('<br/>')} |"
}.join('\n')}
"""

    if (totalFailures + totalErrors > 0) {
      throw new GradleException(
          "Story 11.9 matching regression suite failed; see ${matrixSummary.absolutePath}"
      )
    }
  }
}

tasks.register('matchingRegressionSuite') {
  description = 'Runs Story 11.9 matching contract and persistence regression suites with evidence export.'
  group = 'verification'
  dependsOn tasks.named('matchingRegressionEvidence')
}

tasks.register('resilienceScenarioTest', Test) {
  description = 'Runs cross-module resilience scenario coverage for Story 6.6.'
  group = 'verification'
  testClassesDirs = sourceSets.resilienceScenario.output.classesDirs
  classpath = sourceSets.resilienceScenario.runtimeClasspath
  shouldRunAfter tasks.named('test')
  useJUnitPlatform()
  maxParallelForks = 1
  systemProperty 'corebank.ledger-integrity.enabled', 'false'
}

tasks.named('check') {
  dependsOn tasks.named('resilienceScenarioTest')
}
