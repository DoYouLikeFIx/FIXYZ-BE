  implementation project(':core-common')
  implementation project(':corebank-domain')

  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-aop'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'com.h2database:h2:2.2.224'
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
  testImplementation platform("org.testcontainers:testcontainers-bom:${rootProject.ext.testcontainersVersion}")
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:mysql'
  testImplementation "org.wiremock:wiremock-standalone:${rootProject.ext.wiremockVersion}"

  resilienceScenarioImplementation project(':fep-gateway')
  resilienceScenarioImplementation project(':fep-simulator')
}
