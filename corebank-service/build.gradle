plugins {
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
  id 'org.springdoc.openapi-gradle-plugin'
}

import java.net.ServerSocket

def defaultSpringdocPort = 18081

def isTcpPortAvailable = { int port ->
  try {
    new ServerSocket(port).withCloseable { true }
  } catch (IOException ignored) {
    false
  }
}

def findAvailableTcpPort = {
  new ServerSocket(0).withCloseable { socket ->
    socket.localPort
  }
}

def requestedSpringdocPort = providers.gradleProperty('openapiPort')
    .orElse(providers.environmentVariable('OPENAPI_SERVER_PORT'))
    .orNull

def springdocPort = requestedSpringdocPort != null
    ? requestedSpringdocPort.toInteger()
    : (isTcpPortAvailable(defaultSpringdocPort) ? defaultSpringdocPort : findAvailableTcpPort())

if (requestedSpringdocPort == null && springdocPort != defaultSpringdocPort) {
  logger.lifecycle("OpenAPI port ${defaultSpringdocPort} is busy; using ${springdocPort} for forked docs generation.")
}

Closure<String> normalizeOpenApiText = { String text ->
  text.replace("\r\n", "\n")
      .replaceAll(/"url"\s*:\s*"http:\/\/localhost:\d+"/, "\"url\": \"http://localhost:${defaultSpringdocPort}\"")
      .replaceAll(/"url"\s*:\s*"http:\/\/127\.0\.0\.1:\d+"/, "\"url\": \"http://localhost:${defaultSpringdocPort}\"")
      .replaceFirst(/\n\z/, '')
}

openApi {
  apiDocsUrl = "http://localhost:${springdocPort}/v3/api-docs"
  outputDir = file("$buildDir/openapi")
  outputFileName = "${project.name}.json"
  waitTimeInSeconds = 60
  customBootRun {
    args = ["--spring.profiles.active=openapi", "--server.port=${springdocPort}"]
  }
}

tasks.register('normalizeGeneratedOpenApi') {
  doLast {
    File generated = file("$buildDir/openapi/${project.name}.json")
    if (!generated.exists()) {
      throw new GradleException("Generated OpenAPI file is missing: ${generated}")
    }

    generated.setText(normalizeOpenApiText(generated.getText('UTF-8')) + "\n", 'UTF-8')
  }
}

tasks.named('generateOpenApiDocs') {
  finalizedBy tasks.named('normalizeGeneratedOpenApi')
}

tasks.named('forkedSpringBootRun') {
  dependsOn(':core-common:jar', ':corebank-domain:jar')
}

def generatedOpenApiFile = layout.buildDirectory.file("openapi/${project.name}.json")
def committedOpenApiFile = rootProject.layout.projectDirectory.file("contracts/openapi/${project.name}.json")

tasks.register('verifyCommittedOpenApi') {
  dependsOn tasks.named('generateOpenApiDocs')

  doLast {
    File generated = generatedOpenApiFile.get().asFile
    File committed = committedOpenApiFile.asFile

    if (!generated.exists()) {
      throw new GradleException("Generated OpenAPI file is missing: ${generated}")
    }
    if (!committed.exists()) {
      throw new GradleException("Committed OpenAPI file is missing: ${committed}")
    }

    String generatedText = normalizeOpenApiText(generated.getText('UTF-8'))
    String committedText = normalizeOpenApiText(committed.getText('UTF-8'))
    def jsonSlurper = new groovy.json.JsonSlurper()
    if (jsonSlurper.parseText(generatedText) != jsonSlurper.parseText(committedText)) {
      throw new GradleException(
          "Committed OpenAPI snapshot is out of date. Regenerate :corebank-service:generateOpenApiDocs and sync contracts/openapi/${project.name}.json."
      )
    }
  }
}

tasks.named('check') {
  dependsOn tasks.named('verifyCommittedOpenApi')
}

sourceSets {
  resilienceScenario {
    java.srcDir 'src/resilienceScenario/java'
    resources.srcDir 'src/resilienceScenario/resources'
    compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
    runtimeClasspath += output + compileClasspath
  }
}

configurations {
  resilienceScenarioImplementation.extendsFrom testImplementation
  resilienceScenarioCompileOnly.extendsFrom testCompileOnly
  resilienceScenarioRuntimeOnly.extendsFrom testRuntimeOnly
  resilienceScenarioAnnotationProcessor.extendsFrom testAnnotationProcessor
}

tasks.withType(Test).configureEach {
  systemProperty 'corebank.ledger-integrity.enabled', 'false'
}

tasks.register('correlationPropagationTests', Test) {
  description = 'Runs the corebank correlation-id propagation regression suite.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching('com.fix.corebank.filter.CorrelationIdFilterTest')
    includeTestsMatching('com.fix.corebank.security.InternalSecretFilterTest')
  }
}

tasks.register('resilienceScenarioTest', Test) {
  description = 'Runs cross-module resilience scenario coverage for Story 6.6.'
  group = 'verification'
  testClassesDirs = sourceSets.resilienceScenario.output.classesDirs
  classpath = sourceSets.resilienceScenario.runtimeClasspath
  shouldRunAfter tasks.named('test')
  useJUnitPlatform()
  maxParallelForks = 1
  systemProperty 'corebank.ledger-integrity.enabled', 'false'
}

tasks.named('check') {
  dependsOn tasks.named('resilienceScenarioTest')
}

dependencies {
  implementation project(':core-common')
  implementation project(':corebank-domain')

  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-aop'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'com.h2database:h2:2.2.224'
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
  testImplementation platform("org.testcontainers:testcontainers-bom:${rootProject.ext.testcontainersVersion}")
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:mysql'
  testImplementation "org.wiremock:wiremock-standalone:${rootProject.ext.wiremockVersion}"

  resilienceScenarioImplementation project(':fep-gateway')
  resilienceScenarioImplementation project(':fep-simulator')
}
