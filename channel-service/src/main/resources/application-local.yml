spring:
  datasource:
    url: ${CHANNEL_DB_URL:jdbc:mysql://mysql:3306/channel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CHANNEL_DB_USERNAME:${MYSQL_USER:fix}}
    password: ${CHANNEL_DB_PASSWORD:${MYSQL_PASSWORD:fix}}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

auth:
  totp:
    vault:
      base-url: ${AUTH_TOTP_VAULT_BASE_URL:${VAULT_ADDR:http://vault:8200}}
      token: ${AUTH_TOTP_VAULT_TOKEN:${VAULT_TOKEN:root-token}}
      trust-store-path: ${AUTH_TOTP_VAULT_TRUST_STORE_PATH:}
      trust-store-password: ${AUTH_TOTP_VAULT_TRUST_STORE_PASSWORD:}
      trust-store-type: ${AUTH_TOTP_VAULT_TRUST_STORE_TYPE:PKCS12}

corebank:
  internal:
    base-url: ${COREBANK_INTERNAL_BASE_URL:http://corebank-service:8081}

server:
  servlet:
    session:
      cookie:
        secure: false
