server:
  port: 8080
  servlet:
    session:
      timeout: ${CHANNEL_SESSION_TIMEOUT:30m}
      cookie:
        name: SESSION
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  application:
    name: channel-service
  datasource:
    url: ${CHANNEL_DB_URL:jdbc:mysql://localhost:3306/channel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CHANNEL_DB_USERNAME:fix}
    password: ${CHANNEL_DB_PASSWORD:fix}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: ${CHANNEL_SESSION_TIMEOUT:30m}
    redis:
      namespace: fixyz:channel:session
      repository-type: INDEXED

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui/index.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true

channel:
  audit-security-retention:
    enabled: ${CHANNEL_AUDIT_SECURITY_RETENTION_ENABLED:true}

internal:
  secret: ${INTERNAL_SECRET:local-internal-secret}

auth:
  login-token:
    ttl: ${AUTH_LOGIN_TOKEN_TTL:5m}
  demo:
    auto-totp-enrolled: ${AUTH_DEMO_AUTO_TOTP_ENROLLED:false}
  guardrails:
    ip-rate-limit:
      max-failed-attempts: ${AUTH_IP_RATE_LIMIT_MAX_FAILED_ATTEMPTS:5}
      window-seconds: ${AUTH_IP_RATE_LIMIT_WINDOW_SECONDS:60}
    otp-verify:
      max-attempts: ${AUTH_OTP_VERIFY_MAX_ATTEMPTS:3}
      window-seconds: ${AUTH_OTP_VERIFY_WINDOW_SECONDS:300}
    totp-enroll:
      max-attempts: ${AUTH_TOTP_ENROLL_MAX_ATTEMPTS:5}
      window-seconds: ${AUTH_TOTP_ENROLL_WINDOW_SECONDS:300}
    account-lockout:
      max-failed-attempts: ${AUTH_ACCOUNT_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
  totp:
    issuer: ${AUTH_TOTP_ISSUER:FIXYZ}
    enrollment-pepper: ${AUTH_TOTP_ENROLLMENT_PEPPER:dev-totp-enrollment-pepper}
    secret-store: ${AUTH_TOTP_SECRET_STORE:in-memory}
    vault:
      base-url: ${AUTH_TOTP_VAULT_BASE_URL:}
      token: ${AUTH_TOTP_VAULT_TOKEN:}
      mount: ${AUTH_TOTP_VAULT_MOUNT:secret}
      trust-store-path: ${AUTH_TOTP_VAULT_TRUST_STORE_PATH:}
      trust-store-password: ${AUTH_TOTP_VAULT_TRUST_STORE_PASSWORD:}
      trust-store-type: ${AUTH_TOTP_VAULT_TRUST_STORE_TYPE:PKCS12}
      connect-timeout: ${AUTH_TOTP_VAULT_CONNECT_TIMEOUT:2s}
      read-timeout: ${AUTH_TOTP_VAULT_READ_TIMEOUT:5s}
  password-recovery:
    forgot:
      ip:
        max-attempts: ${AUTH_PASSWORD_RECOVERY_FORGOT_IP_MAX_ATTEMPTS:5}
        window: ${AUTH_PASSWORD_RECOVERY_FORGOT_IP_WINDOW:1m}
      email:
        max-attempts: ${AUTH_PASSWORD_RECOVERY_FORGOT_EMAIL_MAX_ATTEMPTS:3}
        window: ${AUTH_PASSWORD_RECOVERY_FORGOT_EMAIL_WINDOW:15m}
      mail-cooldown: ${AUTH_PASSWORD_RECOVERY_FORGOT_MAIL_COOLDOWN:5m}
      challenge-required-after-attempts: ${AUTH_PASSWORD_RECOVERY_FORGOT_CHALLENGE_REQUIRED_AFTER_ATTEMPTS:1}
    challenge:
      ip:
        max-attempts: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_IP_MAX_ATTEMPTS:5}
        window: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_IP_WINDOW:1m}
      email:
        max-attempts: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_EMAIL_MAX_ATTEMPTS:3}
        window: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_EMAIL_WINDOW:10m}
      global:
        max-attempts: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_GLOBAL_MAX_ATTEMPTS:60}
        window: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_GLOBAL_WINDOW:1m}
      ttl-seconds: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_TTL_SECONDS:300}
      type: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_TYPE:proof-of-work}
      v2-enabled: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_V2_ENABLED:false}
      cohort-percentage: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_COHORT_PERCENTAGE:0}
      cohort-salt: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_COHORT_SALT:dev-password-recovery-challenge-cohort-salt}
      deterministic-override-enabled: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_DETERMINISTIC_OVERRIDE_ENABLED:false}
      deterministic-override-header: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_DETERMINISTIC_OVERRIDE_HEADER:X-Fixyz-Recovery-Challenge-Mode}
      observability-secret: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_OBSERVABILITY_SECRET:dev-password-recovery-observability-secret}
      difficulty-bits: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_DIFFICULTY_BITS:18}
    reset:
      ip:
        max-attempts: ${AUTH_PASSWORD_RECOVERY_RESET_IP_MAX_ATTEMPTS:10}
        window: ${AUTH_PASSWORD_RECOVERY_RESET_IP_WINDOW:5m}
      token:
        max-attempts: ${AUTH_PASSWORD_RECOVERY_RESET_TOKEN_MAX_ATTEMPTS:5}
        window: ${AUTH_PASSWORD_RECOVERY_RESET_TOKEN_WINDOW:15m}
      global:
        max-attempts: ${AUTH_PASSWORD_RECOVERY_RESET_GLOBAL_MAX_ATTEMPTS:60}
        window: ${AUTH_PASSWORD_RECOVERY_RESET_GLOBAL_WINDOW:1m}
      token-ttl: ${AUTH_PASSWORD_RECOVERY_RESET_TOKEN_TTL:15m}
    token:
      current-pepper-version: ${AUTH_PASSWORD_RECOVERY_TOKEN_CURRENT_PEPPER_VERSION:2}
      current-pepper: ${AUTH_PASSWORD_RECOVERY_TOKEN_CURRENT_PEPPER:dev-current-pepper}
      previous-pepper-version: ${AUTH_PASSWORD_RECOVERY_TOKEN_PREVIOUS_PEPPER_VERSION:1}
      previous-pepper: ${AUTH_PASSWORD_RECOVERY_TOKEN_PREVIOUS_PEPPER:dev-previous-pepper}
      challenge-signing-secret: ${AUTH_PASSWORD_RECOVERY_CHALLENGE_SIGNING_SECRET:dev-password-recovery-signing-secret}
    timing:
      forgot:
        floor-ms: ${AUTH_PASSWORD_RECOVERY_TIMING_FORGOT_FLOOR_MS:400}
        jitter-max-ms: ${AUTH_PASSWORD_RECOVERY_TIMING_FORGOT_JITTER_MAX_MS:50}
      reset:
        floor-ms: ${AUTH_PASSWORD_RECOVERY_TIMING_RESET_FLOOR_MS:120}
        jitter-max-ms: ${AUTH_PASSWORD_RECOVERY_TIMING_RESET_JITTER_MAX_MS:20}
    cleanup:
      enabled: ${AUTH_PASSWORD_RECOVERY_CLEANUP_ENABLED:true}
      cadence: ${AUTH_PASSWORD_RECOVERY_CLEANUP_CADENCE:15m}
      retention: ${AUTH_PASSWORD_RECOVERY_CLEANUP_RETENTION:30d}
      batch-size: ${AUTH_PASSWORD_RECOVERY_CLEANUP_BATCH_SIZE:500}
      max-batches-per-run: ${AUTH_PASSWORD_RECOVERY_CLEANUP_MAX_BATCHES_PER_RUN:8}
      max-run-seconds: ${AUTH_PASSWORD_RECOVERY_CLEANUP_MAX_RUN_SECONDS:20}
      backlog-alert-threshold: ${AUTH_PASSWORD_RECOVERY_CLEANUP_BACKLOG_ALERT_THRESHOLD:10000}

corebank:
  internal:
    base-url: ${COREBANK_INTERNAL_BASE_URL:http://localhost:8081}
    secret: ${COREBANK_INTERNAL_SECRET:${INTERNAL_SECRET:local-internal-secret}}

order:
  session:
    recovery:
      enabled: ${ORDER_SESSION_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${ORDER_SESSION_RECOVERY_FIXED_DELAY_MS:60000}
      batch-size: ${ORDER_SESSION_RECOVERY_BATCH_SIZE:100}
      executing-timeout: ${ORDER_SESSION_RECOVERY_EXECUTING_TIMEOUT:30s}
      max-retry-count: ${ORDER_SESSION_RECOVERY_MAX_RETRY_COUNT:5}
      backoff:
        initial: ${ORDER_SESSION_RECOVERY_BACKOFF_INITIAL:60s}
        max: ${ORDER_SESSION_RECOVERY_BACKOFF_MAX:15m}
      manual-queue:
        publish-batch-size: ${ORDER_SESSION_RECOVERY_MANUAL_QUEUE_PUBLISH_BATCH_SIZE:100}
        claim-timeout: ${ORDER_SESSION_RECOVERY_MANUAL_QUEUE_CLAIM_TIMEOUT:5m}
