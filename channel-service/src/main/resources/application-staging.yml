springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

auth:
  totp:
    secret-store: vault
    vault:
      base-url: ${AUTH_TOTP_VAULT_BASE_URL}
      token: ${AUTH_TOTP_VAULT_TOKEN}
      trust-store-path: ${AUTH_TOTP_VAULT_TRUST_STORE_PATH:}
      trust-store-password: ${AUTH_TOTP_VAULT_TRUST_STORE_PASSWORD:}
      trust-store-type: ${AUTH_TOTP_VAULT_TRUST_STORE_TYPE:PKCS12}

internal:
  secret: ${INTERNAL_SECRET}

corebank:
  internal:
    secret: ${COREBANK_INTERNAL_SECRET:${INTERNAL_SECRET}}
