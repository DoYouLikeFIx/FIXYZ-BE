springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

auth:
  totp:
    secret-store: vault
    vault:
      base-url: ${AUTH_TOTP_VAULT_BASE_URL}
      token: ${AUTH_TOTP_VAULT_TOKEN}

corebank:
  internal:
    secret: ${COREBANK_INTERNAL_SECRET:${INTERNAL_SECRET}}
