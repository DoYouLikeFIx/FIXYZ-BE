plugins {
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
  id 'org.springdoc.openapi-gradle-plugin'
}

ext.openapiDefaultPort = 28080
ext.openapiBootRunDependencies = [':core-common:jar', ':channel-domain:jar']

apply from: rootProject.file('gradle/openapi-contract.gradle')

tasks.register('criticalContractSuites', Test) {
  description = 'Runs channel critical contract suites used by CI and local verification.'
  group = 'verification'
  useJUnitPlatform()
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching('com.fix.channel.integration.AdminSessionAuditIntegrationTest')
    includeTestsMatching('com.fix.channel.contract.ChannelOpenApiCompatibilityTest')
    includeTestsMatching('com.fix.channel.controller.ChannelErrorContractTest')
  }
}

tasks.register('correlationPropagationTests', Test) {
  description = 'Runs channel correlation propagation regressions.'
  group = 'verification'
  useJUnitPlatform()
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching('com.fix.channel.filter.CorrelationIdFilterTest')
    includeTestsMatching('com.fix.channel.client.CorebankClientTest')
    includeTestsMatching('com.fix.channel.integration.ChannelCorrelationPropagationIntegrationTest')
  }
}

dependencies {
  implementation project(':core-common')
  implementation project(':channel-domain')

  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.session:spring-session-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'
  implementation 'org.apache.httpcomponents.client5:httpclient5'
  implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'

  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'com.h2database:h2'
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
  testImplementation platform("org.testcontainers:testcontainers-bom:${rootProject.ext.testcontainersVersion}")
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:mysql'
  testImplementation "org.wiremock:wiremock-standalone:${rootProject.ext.wiremockVersion}"
}
