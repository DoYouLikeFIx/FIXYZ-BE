name: ci-corebank

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci-corebank:
    name: ci-corebank
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify corebank lane
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core-common:test \
            :corebank-domain:test \
            :corebank-service:test \
            :corebank-service:resilienceScenarioTest
