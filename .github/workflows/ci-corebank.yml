name: ci-corebank

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-corebank:
    name: ci-corebank
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_21_X64:-}" ]]; then
            JAVA_HOME_CANDIDATE="$JAVA_HOME_21_X64"
          elif [[ -n "${JAVA_HOME_21_ARM64:-}" ]]; then
            JAVA_HOME_CANDIDATE="$JAVA_HOME_21_ARM64"
          elif command -v java >/dev/null 2>&1; then
            JAVA_BIN="$(readlink -f "$(command -v java)")"
            JAVA_HOME_CANDIDATE="$(cd "$(dirname "$JAVA_BIN")/.." && pwd)"
          else
            echo "Unable to locate a Java runtime on the runner." >&2
            exit 1
          fi

          JAVA_VERSION_LINE="$("$JAVA_HOME_CANDIDATE/bin/java" -version 2>&1 | head -n 1)"
          echo "$JAVA_VERSION_LINE"
          if [[ "$JAVA_VERSION_LINE" != *'"21.'* && "$JAVA_VERSION_LINE" != *'"21"'* ]]; then
            echo "Expected Java 21 but resolved: $JAVA_VERSION_LINE" >&2
            exit 1
          fi

          echo "JAVA_HOME=$JAVA_HOME_CANDIDATE" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_CANDIDATE/bin" >> "$GITHUB_PATH"

      - name: Verify corebank lane
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core-common:test \
            :corebank-domain:test \
            :corebank-service:test
