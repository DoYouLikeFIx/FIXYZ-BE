name: ci-quality-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-quality-gate:
    name: ci-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_21_X64:-}" ]]; then
            JAVA_HOME_CANDIDATE="$JAVA_HOME_21_X64"
          elif [[ -n "${JAVA_HOME_21_ARM64:-}" ]]; then
            JAVA_HOME_CANDIDATE="$JAVA_HOME_21_ARM64"
          elif command -v java >/dev/null 2>&1; then
            JAVA_BIN="$(readlink -f "$(command -v java)")"
            JAVA_HOME_CANDIDATE="$(cd "$(dirname "$JAVA_BIN")/.." && pwd)"
          else
            echo "Unable to locate a Java runtime on the runner." >&2
            exit 1
          fi

          JAVA_VERSION_LINE="$("$JAVA_HOME_CANDIDATE/bin/java" -version 2>&1 | head -n 1)"
          echo "$JAVA_VERSION_LINE"
          if [[ "$JAVA_VERSION_LINE" != *'"21.'* && "$JAVA_VERSION_LINE" != *'"21"'* ]]; then
            echo "Expected Java 21 but resolved: $JAVA_VERSION_LINE" >&2
            exit 1
          fi

          echo "JAVA_HOME=$JAVA_HOME_CANDIDATE" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_CANDIDATE/bin" >> "$GITHUB_PATH"

      - name: Verify quality gate tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core-common:test \
            :channel-domain:test \
            :channel-service:test \
            :corebank-domain:test \
            :corebank-service:test \
            :fep-gateway:test \
            :fep-simulator:test

      - name: Generate OpenAPI docs
        run: |
          ./gradlew --no-daemon --stacktrace \
            :channel-service:generateOpenApiDocs \
            :corebank-service:generateOpenApiDocs \
            :fep-gateway:generateOpenApiDocs \
            :fep-simulator:generateOpenApiDocs

      - name: Verify OpenAPI snapshots
        run: |
          git diff --no-index --ignore-cr-at-eol --exit-code contracts/openapi/channel-service.json channel-service/build/openapi/channel-service.json
          git diff --no-index --ignore-cr-at-eol --exit-code contracts/openapi/corebank-service.json corebank-service/build/openapi/corebank-service.json
          git diff --no-index --ignore-cr-at-eol --exit-code contracts/openapi/fep-gateway.json fep-gateway/build/openapi/fep-gateway.json
          git diff --no-index --ignore-cr-at-eol --exit-code contracts/openapi/fep-simulator.json fep-simulator/build/openapi/fep-simulator.json
