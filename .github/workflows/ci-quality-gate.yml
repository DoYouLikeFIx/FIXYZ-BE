name: ci-quality-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci-quality-gate:
    name: ci-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify quality gate tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core-common:test \
            :channel-domain:test \
            :channel-service:test \
            :corebank-domain:test \
            :corebank-service:test \
            :corebank-service:resilienceScenarioTest \
            :fep-gateway:test \
            :fep-simulator:test \
            epic10AcceptanceGate

      - name: Verify OpenAPI snapshots
        run: |
          ./gradlew --no-daemon --stacktrace \
            :channel-service:verifyCommittedOpenApi \
            :corebank-service:verifyCommittedOpenApi \
            :fep-gateway:verifyCommittedOpenApi \
            :fep-simulator:verifyCommittedOpenApi

      - name: Upload Story 10.1 acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epic10-acceptance-evidence-${{ github.run_id }}
          path: _bmad-output/test-artifacts/epic-10/**
          if-no-files-found: error
