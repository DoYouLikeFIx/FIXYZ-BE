name: ci-quality-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci-quality-gate:
    name: ci-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify quality gate tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core-common:test \
            :channel-domain:test \
            :channel-service:test \
            :corebank-domain:test \
            :corebank-service:test \
            :fep-gateway:test \
            :fep-simulator:test

      - name: Verify OpenAPI snapshots
        run: |
          ./gradlew --no-daemon --stacktrace \
            :channel-service:verifyCommittedOpenApi \
            :corebank-service:verifyCommittedOpenApi \
            :fep-gateway:verifyCommittedOpenApi \
            :fep-simulator:verifyCommittedOpenApi
