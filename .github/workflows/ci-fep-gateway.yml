name: ci-fep-gateway

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci-fep-gateway:
    name: ci-fep-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify fep-gateway lane
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core-common:test \
            :fep-gateway:test
