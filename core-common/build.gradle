plugins {
  id 'java-library'
}

def querydslVersion = '5.1.0'
def swaggerVersion = '2.2.28'
def querydslGeneratedDir = "$buildDir/generated/sources/annotationProcessor/java/main"

dependencies {
  api 'jakarta.persistence:jakarta.persistence-api:3.1.0'
  api "io.swagger.core.v3:swagger-annotations-jakarta:${swaggerVersion}"
  api "io.swagger.core.v3:swagger-models-jakarta:${swaggerVersion}"
  compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
  compileOnly "io.swagger.core.v3:swagger-annotations-jakarta:${swaggerVersion}"
  testCompileOnly "io.swagger.core.v3:swagger-annotations-jakarta:${swaggerVersion}"
  implementation 'com.fasterxml.jackson.core:jackson-annotations:2.21'
  implementation 'org.slf4j:slf4j-api:2.0.16'

  implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
  annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
  annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'
  annotationProcessor 'jakarta.annotation:jakarta.annotation-api:2.1.1'

  testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
  testImplementation 'org.assertj:assertj-core:3.27.2'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

sourceSets {
  main.java.srcDirs += [querydslGeneratedDir]
}

tasks.withType(JavaCompile).configureEach {
  options.generatedSourceOutputDirectory.set(file(querydslGeneratedDir))
}
