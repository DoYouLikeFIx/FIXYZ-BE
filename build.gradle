plugins {
  id 'base'
  id 'org.springframework.boot' version '3.4.13' apply false
  id 'io.spring.dependency-management' version '1.1.7' apply false
  id 'org.springdoc.openapi-gradle-plugin' version '1.9.0' apply false
}

ext {
  testcontainersVersion = '2.0.3'
  wiremockVersion = '3.13.2'
}

allprojects {
  group = 'com.fix'
  version = '0.1.0-SNAPSHOT'

  repositories {
    mavenCentral()
  }
}

subprojects {
  apply plugin: 'java'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(21)
    }

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
  }

  tasks.withType(Test).configureEach {
    useJUnitPlatform()
  }

  dependencies {
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }
}

tasks.register('correlationIdPropagationChecks') {
  group = 'verification'
  description = 'Runs hop-by-hop backend correlation propagation regressions plus the explicit gateway to simulator diagnostic boundary check.'
  dependsOn(
      ':channel-service:correlationPropagationTests',
      ':corebank-service:correlationPropagationTests',
      ':fep-gateway:correlationPropagationTests',
      ':fep-simulator:correlationPropagationTests'
  )
}
