server:
  port: 28083

management:
  server:
    port: 29083
    address: 127.0.0.1

internal:
  secret: local-internal-secret

spring:
  datasource:
    url: jdbc:h2:mem:fep_simulator_openapi;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui/index.html
